repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        # Generated library data: rewriting it by hand would diverge from
        # scripts/build_catalog.py, and the SVGs are third-party reference marks.
        exclude: ^skills/logo-design/assets/library/
      - id: end-of-file-fixer
        exclude: ^skills/logo-design/assets/library/
      - id: check-yaml
      # The logo-design skill ships two generated library indexes (catalog.json,
      # classifications.json) that are well over 500 KB. They are reproducible
      # from the SVG sources with scripts/build_catalog.py, so they are exempt
      # here rather than LFS-tracked or deleted.
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: ^skills/logo-design/assets/library/(catalog|classifications)\.json$
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        description: Format JS/TS/CSS/HTML/JSON/Markdown. Run as a system command
          because pre-commit's nodeenv installer is incompatible with npm >= 11
          for non-root users (see scripts/prettier-hook.sh).
        entry: scripts/prettier-hook.sh
        language: system
        types_or: [javascript, jsx, ts, tsx, css, less, html, json, markdown]
        # Generated library data: pretty-printing a 900 KB JSON on every commit
        # buys nothing and would fight scripts/build_catalog.py's output.
        exclude: ^skills/logo-design/assets/library/

  - repo: local
    hooks:
      - id: project-guardian-auto-combine
        name: Auto-combine scattered memory.db files
        entry: >
            bash -c 'find . -mindepth 2 -type f -name memory.db | while read db; do sqlite3 memory.db "ATTACH DATABASE \"$db\" AS nested; INSERT OR IGNORE INTO entities SELECT * FROM nested.entities; INSERT OR IGNORE INTO relations SELECT * FROM nested.relations;"; rm "$db"; done'
        language: system
        always_run: true
        pass_filenames: false
