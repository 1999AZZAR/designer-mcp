# Byte-stable trees. These are excluded from every reformatting hook, with a
# reason, rather than exempted wholesale — anything we actually maintain is
# linted normally:
#   examples/    showcase/demo artifacts, kept byte-stable so the published
#                demo matches what was designed
#   skills/video/ canonical upstream HyperFrames v0.8.77 packages and upstream
#                workflow docs — reference material, not ours to reformat
#   skills/logo-design/assets/library/  generated indexes (catalog.json and
#                classifications.json are rebuilt by scripts/build_catalog.py)
#                plus third-party reference marks
#
# The list is repeated per hook below because pre-commit has no shared
# exclude; keep the three in sync.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(examples/|skills/video/|skills/logo-design/assets/library/)
      - id: end-of-file-fixer
        exclude: ^(examples/|skills/video/|skills/logo-design/assets/library/)
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: ^skills/logo-design/assets/library/(catalog|classifications)\.json$
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        description: Format JS/TS/CSS/HTML/JSON/Markdown. Runs as a system
          command because pre-commit's nodeenv installer is incompatible with
          npm >= 11 for non-root users — see scripts/prettier-hook.sh.
        entry: scripts/prettier-hook.sh
        language: system
        types_or: [javascript, jsx, ts, tsx, css, less, html, json, markdown]
        exclude: ^(examples/|skills/video/|skills/logo-design/assets/library/)

  - repo: local
    hooks:
      - id: project-guardian-auto-combine
        name: Auto-combine scattered memory.db files
        entry: >
            bash -c 'find . -mindepth 2 -type f -name memory.db | while read db; do sqlite3 memory.db "ATTACH DATABASE \"$db\" AS nested; INSERT OR IGNORE INTO entities SELECT * FROM nested.entities; INSERT OR IGNORE INTO relations SELECT * FROM nested.relations;"; rm "$db"; done'
        language: system
        always_run: true
        pass_filenames: false
